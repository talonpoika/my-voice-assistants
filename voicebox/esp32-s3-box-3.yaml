display:
  - platform: ili9xxx
    id: s3_box_lcd
    model: S3BOX
    invert_colors: false
    data_rate: 40MHz
    cs_pin: 5
    dc_pin: 4
    reset_pin:
      number: 48
      inverted: true
    # Päivitä minuutin välein (tai haluamallasi frekvenssillä)
    update_interval: 5s
    pages:
      - id: idle_page
        # it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_idle), ImageAlign::CENTER);
        lambda: |-
          // Hae nykyinen aika Home Assistantista
          auto now = id(ha_time).now();
          // Muodosta merkkijonot
          char hour_colon[4];
          char minute_str[3];
          sprintf(hour_colon, "%02u:", now.hour);
          sprintf(minute_str, "%02u", now.minute);
          // Hae ulkolämpötila Home Assistantista
          float temp = id(outside_temp_sensor).state;
          char temp_str[8];
          sprintf(temp_str, "%.0f°C", temp);
          // Piirrä sivu
          it.fill(id(idle_color));
          // Piirrä otsikkoruutu keltaisella reunalla vain jos tekstiä on
          if (id(headline_text).state.length() > 0 || id(headline_subtitle).state.length() > 0) {
            for (int i = 0; i < 3; i++) {
              it.rectangle(20 + i, 80 + i, 280 - 2 * i, 80 - 2 * i, Color(0xFF, 0xFF, 0x00));
            }
            it.printf(it.get_width() / 2, 100, id(font_headline_text), Color::WHITE, TextAlign::CENTER, "%s", id(headline_text).state.c_str());
            it.printf(it.get_width() / 2, 130, id(font_headline_subtitle), Color::WHITE, TextAlign::CENTER, "%s", id(headline_subtitle).state.c_str());
          } else {
            std::string data = id(nordpool_prices_today).state;
            data.erase(std::remove(data.begin(), data.end(), '['), data.end());
            data.erase(std::remove(data.begin(), data.end(), ']'), data.end());
            std::vector<float> prices;
            size_t start = 0;
            while (start < data.size()) {
              size_t comma = data.find(',', start);
              std::string token;
              if (comma == std::string::npos) {
                token = data.substr(start);
                start = data.size();
              } else {
                token = data.substr(start, comma - start);
                start = comma + 1;
              }
              if (!token.empty()) {
                prices.push_back(std::stof(token) * 100.0f);
              }
            }
            if (prices.size() > 1) {
              float min_p = *std::min_element(prices.begin(), prices.end());
              float max_p = *std::max_element(prices.begin(), prices.end());
              float min_y = 0.0f;
              float max_y = 7.0f;
              if (min_p < 0.0f) min_y = floor(min_p / 5.0f) * 5.0f;
              if (max_p > 7.0f) max_y = ceil(max_p / 5.0f) * 5.0f;
              float range = max_y - min_y;
              int gx = 20;
              int gy = 80;
              int gw = 280;
              int gh = 80;
              float step = gw / float(prices.size() - 1);
              int px = gx;
              int py = gy + gh - ((prices[0] - min_y) / range) * gh;
              for (size_t i = 1; i < prices.size(); i++) {
                int x = gx + step * i;
                int y = gy + gh - ((prices[i] - min_y) / range) * gh;
                it.line(px, py, x, y, Color::WHITE);
                px = x;
                py = y;
              }
              int zero_y = gy + gh - ((0 - min_y) / range) * gh;
              it.line(gx, zero_y, gx + gw, zero_y, Color(0x80,0x80,0x80));
              float interval_per_hour = prices.size() / 24.0f;
              float now_index = (now.hour + (now.minute / 60.0f)) * interval_per_hour;
              if (now_index < 0.0f) {
                now_index = 0.0f;
              } else if (now_index > (prices.size() - 1)) {
                now_index = prices.size() - 1;
              }
              int now_x = gx + step * now_index;
              it.line(now_x, gy, now_x, gy + gh, Color(0xFF,0xFF,0x00));
            }
          }

          // Hae sähkön hinta Home Assistantista (EUR/kWh -> muutetaan senteiksi)
          float electricity_price_cents = id(electricity_price_sensor).state * 100.0f;
          char price_text[16];
          sprintf(price_text, "%.1f c", electricity_price_cents);
          std::string price_display = price_text;
          if (id(cheap_price_3h).state) {
            price_display += " HALPAA";
          }
          Color price_color = Color::WHITE;
          if (electricity_price_cents >= 15.0f) price_color = Color(0xFF,0x00,0x00);
          else if (electricity_price_cents >= 10.0f) price_color = Color(0xFF,0xFF,0x00);

          float power_now = id(power_sensor).state;
          char power_text[16];
          sprintf(power_text, "%.0f W", power_now);
          Color power_color = power_now > 3000 ? Color(0xFF,0x00,0x00) : Color::WHITE;

          // Hae säätila Home Assistantista
          std::string weather_state = id(outside_weather_sensor).state;

          const char *weather_icon = "\uf07b";
          if (weather_state == "sunny") weather_icon = "\uf00d";
          else if (weather_state == "clear-night") weather_icon = "\uf02e";
          else if (weather_state == "cloudy") weather_icon = "\uf013";
          else if (weather_state == "partlycloudy") weather_icon = "\uf002";
          else if (weather_state == "rainy") weather_icon = "\uf019";
          else if (weather_state == "pouring") weather_icon = "\uf018";
          else if (weather_state == "lightning") weather_icon = "\uf016";
          else if (weather_state == "lightning-rainy") weather_icon = "\uf01d";
          else if (weather_state == "snowy") weather_icon = "\uf01b";
          else if (weather_state == "snowy-rainy") weather_icon = "\uf0b5";
          else if (weather_state == "windy" || weather_state == "windy-variant") weather_icon = "\uf021";
          else if (weather_state == "fog") weather_icon = "\uf014";
          else if (weather_state == "hail") weather_icon = "\uf015";

          // Kellonaika näytöllä
          // Piirrä tunnit & kaksoispiste valkoisella
          it.printf(165, 182, id(font_clock), Color::WHITE, TextAlign::RIGHT, hour_colon);
          // Piirrä minuutit keltaisella
          it.printf(165, 182, id(font_clock), Color(0xFF, 0xFF, 0x00), TextAlign::LEFT, minute_str);
          // Lämpötila ja sää näytöllä
          // Sähkön hinta ja virrankulutus vasemmassa yläkulmassa
          it.printf(10, 10, id(font_mdi), price_color, "󰆭");
          it.printf(45, 10, id(font_energy), price_color, "%s", price_display.c_str());
          it.printf(10, 44, id(font_mdi), power_color, "󰛕");
          it.printf(45, 44, id(font_energy), power_color, "%s", power_text);

          it.printf(190, 10, id(font_weather_icon), Color::WHITE, weather_icon);
          it.printf(it.get_width() - 10, 10, id(font_temp), Color(0xFF, 0xFF, 0x00), TextAlign::RIGHT, temp_str);
          it.printf(it.get_width() - 10, 48, id(font_temp), Color::WHITE, TextAlign::RIGHT, "%s", weather_state.c_str());

          // Kuivausrummun, pyykkikoneen ja Webaston tilat dynaamisesti vasempaan alanurkkaan
          struct StatusItem {
            std::string icon;
            std::string text;
            bool has_icon;
          };
          std::vector<StatusItem> status_items;
          if (id(sorento_webasto_lammitin).state) {
            status_items.push_back({"", "Webasto ON", false});
          }
          {
            std::string dryer_status = id(tumble_dryer_status).state;
            std::transform(dryer_status.begin(), dryer_status.end(), dryer_status.begin(), ::tolower);
            if (dryer_status != "off") {
              char dryer_text[16];
              int dryer_minutes = static_cast<int>(round(id(tumble_dryer_remaining_time).state));
              sprintf(dryer_text, "%d min", dryer_minutes);
              status_items.push_back({"\U000F0917", dryer_text, true});
            }
          }
          {
            std::string wash_status = id(washing_machine_status).state;
            std::transform(wash_status.begin(), wash_status.end(), wash_status.begin(), ::tolower);
            if (wash_status != "off") {
              char wash_text[16];
              int wash_minutes = static_cast<int>(round(id(washing_machine_remaining_time).state));
              sprintf(wash_text, "%d min", wash_minutes);
              status_items.push_back({"\U000F072A", wash_text, true});
            }
          }
          if (!status_items.empty()) {
            int line_height = 20;
            int base_y = it.get_height() - 37; // 22px font height + 15px timeline
            int start_y = base_y - (static_cast<int>(status_items.size()) - 1) * line_height;
            for (size_t i = 0; i < status_items.size(); i++) {
              int y = start_y + (i * line_height);
              const auto &item = status_items[i];
              if (item.has_icon) {
                it.printf(10, y, id(font_mdi), Color::WHITE, "%s", item.icon.c_str());
                it.printf(45, y, id(font_energy), Color::WHITE, "%s", item.text.c_str());
              } else {
                it.printf(10, y, id(font_energy), Color::WHITE, "%s", item.text.c_str());
              }
            }
          }

          // Mahdolliset omat widgetit
          id(draw_timer_timeline).execute();
          id(draw_active_timer_widget).execute();
      - id: listening_page
        lambda: |-
          it.fill(id(listening_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_listening), ImageAlign::CENTER);
          id(draw_timer_timeline).execute();
      - id: thinking_page
        lambda: |-
          it.fill(id(thinking_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_thinking), ImageAlign::CENTER);
          it.filled_rectangle(20 , 20 , 280 , 30 , Color::WHITE );
          it.rectangle(20 , 20 , 280 , 30 , Color::BLACK );
          it.printf(30, 25, id(font_request), Color::BLACK, "%s", id(text_request).state.c_str());
          id(draw_timer_timeline).execute();
      - id: replying_page
        lambda: |-
          it.fill(id(replying_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_replying), ImageAlign::CENTER);
          it.filled_rectangle(20 , 20 , 280 , 30 , Color::WHITE );
          it.rectangle(20 , 20 , 280 , 30 , Color::BLACK );
          it.filled_rectangle(20 , 190 , 280 , 30 , Color::WHITE );
          it.rectangle(20 , 190 , 280 , 30 , Color::BLACK );
          it.printf(30, 25, id(font_request), Color::BLACK, "%s", id(text_request).state.c_str());
          it.printf(30, 195, id(font_response), Color::BLACK, "%s", id(text_response).state.c_str());
          id(draw_timer_timeline).execute();
      - id: timer_finished_page
        lambda: |-
          it.fill(id(idle_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_timer_finished), ImageAlign::CENTER);
      - id: error_page
        lambda: |-
          it.fill(id(error_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_error), ImageAlign::CENTER);
      - id: no_ha_page
        lambda: |-
          it.image((it.get_width() / 2), (it.get_height() / 2), id(error_no_ha), ImageAlign::CENTER);
      - id: no_wifi_page
        lambda: |-
          it.image((it.get_width() / 2), (it.get_height() / 2), id(error_no_wifi), ImageAlign::CENTER);
      - id: initializing_page
        lambda: |-
          it.fill(id(loading_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_initializing), ImageAlign::CENTER);
      - id: muted_page
        lambda: |-
          it.fill(Color::BLACK);
          id(draw_timer_timeline).execute();
          id(draw_active_timer_widget).execute();
